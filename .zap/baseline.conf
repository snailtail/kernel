# ZAP baseline rules for the Web (ZAP baseline) job in .github/workflows/security.yml (#66).
# Rules not listed here are WARN, and any warning fails the job. Format: rule id, tab, level, tab, then the URL regex
# for OUTOFSCOPE (only that URL is skipped) or the rule name. INFO still reports a rule but never fails the job.
# Every exception says why.
#
# Private IP Disclosure: the AI provider form shows "10.0.4.0/24" as an example allowlist entry (placeholder text).
# Only that bundle is skipped, so a private address in any other response still fails.
2	OUTOFSCOPE	.*/assets/Ai-[^/]*\.js
# CSP notices: ZAP flags report-uri as deprecated even next to report-to. Kept on purpose for browsers without the
# Reporting API (Firefox). The policy itself is pinned by server/test/integration/security.test.ts.
10055	INFO	(CSP)
# Informational: comment-like text in minified vendor bundles, "storable" static assets, and "this is a single-page app".
10027	INFO	(Information Disclosure - Suspicious Comments)
10049	INFO	(Storable but Non-Cacheable Content)
10109	INFO	(Modern Web Application)

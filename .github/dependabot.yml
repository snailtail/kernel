# Grouped weekly updates (#66): npm packages, the Node base image digest and the pinned GitHub Actions.
# Cooldown: a release is proposed only once it has aged (14 days, 30 for a major), so a compromised or broken release
# is usually caught by others first. Security updates ignore the cooldown and still arrive at once.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14, semver-major-days: 30 }
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14, semver-major-days: 30 }
    ignore:
      # Stay on the active LTS line: odd-numbered Node releases never become LTS, and the next LTS (26) is adopted
      # deliberately once it is promoted.
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14, semver-major-days: 30 }
    groups:
      actions:
        patterns: ["*"]

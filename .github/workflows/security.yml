name: Security

# Supply chain and code checks (#66). What to do when one fails: docs/security-checks.md.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # weekly, to catch new advisories for unchanged code

permissions:
  contents: read

# Scanner images are pinned by tag and digest: the Trivy steps mount the Docker socket (root on the runner), so a
# re-pushed tag must not run. Update both together when upgrading a scanner.

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependencies (npm audit, OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Production dependencies must have no known high or critical vulnerability.
      - run: npm audit --omit=dev --audit-level=high
      - name: OSV scanner
        run: docker run --rm -v "$PWD":/src ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa scan source --lockfile /src/package-lock.json

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --config /repo/.gitleaks.toml --redact --no-banner

  sast:
    name: Code (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # OWASP and Node rule sets plus Kernel's own rule against SQL built from input (.semgrep/kernel.yml).
      - run: >-
          docker run --rm -v "$PWD":/src -w /src semgrep/semgrep:1.140.0@sha256:4372a1de903521f9f10f877b6caf15d150d17e1ca592582682c8d02b77cbd4f6 semgrep scan --metrics=off --error
          --config p/owasp-top-ten --config p/typescript --config p/nodejs --config .semgrep/kernel.yml
          server/src web/src

  image:
    name: Container image (Trivy, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t kernel:ci .
      # Fail on fixable high or critical vulnerabilities in the image that would be deployed.
      - run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 image
          --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln,secret kernel:ci
      - name: SBOM (CycloneDX)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/out aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 image
          --format cyclonedx --output /out/kernel-sbom.cdx.json kernel:ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: kernel-sbom.cdx.json

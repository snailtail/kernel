name: Security

# Supply chain and code checks (#66). What to do when one fails: docs/security-checks.md.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # weekly, to catch new advisories for unchanged code

permissions:
  contents: read

# Scanner images are pinned by tag and digest in .github/tools/Dockerfile, where Dependabot updates them; the steps
# read them with scripts/tool-image.sh.

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependencies (npm audit, OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Production dependencies must have no known high or critical vulnerability.
      - run: npm audit --omit=dev --audit-level=high
      - name: OSV scanner
        run: docker run --rm -v "$PWD":/src "$(scripts/tool-image.sh osv-scanner)" scan source --lockfile /src/package-lock.json

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: docker run --rm -v "$PWD":/repo "$(scripts/tool-image.sh gitleaks)" git /repo --config /repo/.gitleaks.toml --redact --no-banner

  sast:
    name: Code (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # OWASP and Node rule sets plus Kernel's own rule against SQL built from input (.semgrep/kernel.yml).
      - run: >-
          docker run --rm -v "$PWD":/src -w /src "$(scripts/tool-image.sh semgrep)" semgrep scan --metrics=off --error
          --config p/owasp-top-ten --config p/typescript --config p/nodejs --config .semgrep/kernel.yml
          server/src web/src

  image:
    name: Container image (Trivy, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t kernel:ci .
      # Fail on fixable high or critical vulnerabilities in the image that would be deployed.
      - run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$(scripts/tool-image.sh trivy)" image
          --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln,secret kernel:ci
      - name: SBOM (CycloneDX)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/out "$(scripts/tool-image.sh trivy)" image
          --format cyclonedx --output /out/kernel-sbom.cdx.json kernel:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: kernel-sbom.cdx.json

  dast:
    name: Web (ZAP baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A throwaway instance with random secrets, as deployed (docker-compose.yml), reached only from this runner.
      - name: Start Kernel
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "KERNEL_APP_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "KERNEL_SECRET_KEY=$(openssl rand -hex 32)"
            echo "KERNEL_ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "KERNEL_PORT=8080"
          } > .env
          docker compose up -d --build --wait app
      # Passive scan of what an unauthenticated visitor can reach: headers, cookies, CSP, information leaks.
      # Every rule fails the job unless .zap/baseline.conf sets it to IGNORE with a reason.
      - name: ZAP baseline
        run: |
          mkdir -p zap && cp .zap/baseline.conf zap/ && chmod -R a+rwX zap
          docker run --rm --network host -v "$PWD/zap":/zap/wrk "$(scripts/tool-image.sh zap)" \
            zap-baseline.py -t http://localhost:8080 -c baseline.conf -r zap-report.html -J zap-report.json -m 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-report
          path: zap/zap-report.*
      - if: always()
        run: docker compose down -v

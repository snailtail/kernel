name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege (#66): this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kernel
          POSTGRES_PASSWORD: kernel
          POSTGRES_DB: kernel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kernel -d kernel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://kernel:kernel@localhost:5432/kernel_test
    steps:
      # Third-party actions are pinned by commit SHA; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # A throwaway mail server for the mailbox connector tests (#48), started first so it is up by the time they run.
      - name: Start GreenMail (IMAP and SMTP, test users only)
        run: >-
          docker run -d --name greenmail -p 127.0.0.1:3025:3025 -p 127.0.0.1:3143:3143
          -e GREENMAIL_OPTS="-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=support:secret@example.com"
          "$(scripts/tool-image.sh greenmail)"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # Unused files and exports fail the build (#174), so dead code doesn't pile up again.
      - run: npm run knip
      - run: npm test
        env:
          GREENMAIL_HOST: 127.0.0.1
      # The demo data goes through the service layer, so a schema or API change that breaks it fails here (#115).
      - name: Demo data seeds a fresh database
        run: npm run demo:reset
        env:
          DATABASE_URL: postgres://kernel:kernel@localhost:5432/kernel_ci_demo
          LOG_LEVEL: warn
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Main only, once the tests and the image build pass: push the image to GHCR and sign it keyless with Sigstore.
  # scripts/deploy.sh deploys only an image signed by this workflow for the exact commit it deploys.
  publish:
    name: Publish signed image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # the workflow's OIDC identity goes into the signing certificate
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }},${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # An SBOM and build provenance travel with the image as attestations, covered by the signature below.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
      # Signs the digest, never a tag; the certificate records this workflow, the ref and the commit.
      - run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

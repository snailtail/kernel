name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the action reads its own workflow run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          queries: security-extended
      # The repository is private without code scanning, so results are kept as an artifact and fail the job here.
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
      - name: Fail on findings
        run: |
          python3 - <<'PY'
          import glob, json, sys
          found = []
          for path in glob.glob('codeql-results/*.sarif'):
              for run in json.load(open(path))['runs']:
                  rules = {r['id']: r for r in run['tool']['driver'].get('rules', [])}
                  for r in run.get('results', []):
                      loc = r['locations'][0]['physicalLocation']
                      # Accepted false positives carry "// codeql[rule-id] -- reason" on the line before (or on) the finding.
                      # The CLI does not record such comments in the SARIF, so they are read from the source here.
                      uri, line = loc['artifactLocation']['uri'], loc.get('region', {}).get('startLine') or 0
                      try:
                          lines = open(uri, encoding='utf-8').read().split('\n')
                      except OSError:
                          lines = []
                      near = lines[max(0, line - 2):line]
                      if r.get('suppressions') or any(f"codeql[{r['ruleId']}] -- " in l for l in near):
                          print(f"suppressed in source: {r['ruleId']}: {loc['artifactLocation']['uri']}:{loc.get('region', {}).get('startLine')}")
                          continue
                      found.append(f"{r['ruleId']}: {loc['artifactLocation']['uri']}:{loc.get('region', {}).get('startLine')} {r['message']['text'][:160]}")
                      # The source and steps of a data-flow finding, so it can be fixed without the SARIF file.
                      for rel in r.get('relatedLocations', []):
                          pl = rel['physicalLocation']
                          found.append(f"    related {rel.get('id')}: {pl['artifactLocation']['uri']}:{pl.get('region', {}).get('startLine')}")
                      for flow in r.get('codeFlows', [])[:1]:
                          for step in flow['threadFlows'][0]['locations']:
                              pl = step['location']['physicalLocation']
                              found.append(f"    step: {pl['artifactLocation']['uri']}:{pl.get('region', {}).get('startLine')}")
          print('\n'.join(found) or 'No findings')
          sys.exit(1 if found else 0)
          PY

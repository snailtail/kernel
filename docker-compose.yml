name: kernel

services:
  app:
    build: .
    image: kernel:latest
    restart: unless-stopped
    ports:
      - "${KERNEL_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://kernel:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/kernel
      KERNEL_ADMIN_PASSWORD: ${KERNEL_ADMIN_PASSWORD:-}
      KERNEL_SECURE_COOKIES: ${KERNEL_SECURE_COOKIES:-false}
      KERNEL_TRUST_PROXY: ${KERNEL_TRUST_PROXY:-false}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kernel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kernel
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kernel -d kernel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

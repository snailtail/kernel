name: kernel

services:
  app:
    build: .
    image: kernel:latest
    restart: unless-stopped
    ports:
      - "${KERNEL_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://kernel:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/kernel
      KERNEL_ADMIN_PASSWORD: ${KERNEL_ADMIN_PASSWORD:-}
      KERNEL_SECURE_COOKIES: ${KERNEL_SECURE_COOKIES:-false}
      KERNEL_TRUST_PROXY: ${KERNEL_TRUST_PROXY:-false}
      KERNEL_MCP_URL: ${KERNEL_MCP_URL:-}
      KERNEL_PUBLIC_URL: ${KERNEL_PUBLIC_URL:-}
      # Email notifications (#48), e.g. smtp://user:password@smtp.example.com:587; unset = in-app and chat only.
      SMTP_URL: ${SMTP_URL:-}
      KERNEL_MAIL_FROM: ${KERNEL_MAIL_FROM:-Kernel <kernel@localhost>}
      KERNEL_LOG_FORMAT: ${KERNEL_LOG_FORMAT:-json}
      KERNEL_SECRET_KEY: ${KERNEL_SECRET_KEY:-}
      KERNEL_SECRET_KEYS: ${KERNEL_SECRET_KEYS:-}
      KERNEL_SECRET_KEY_ID: ${KERNEL_SECRET_KEY_ID:-}
      # The app connects as this least-privilege role; DATABASE_URL (the owner) only runs migrations.
      KERNEL_APP_DB_PASSWORD: ${KERNEL_APP_DB_PASSWORD:-}
      # Read-only role for Power BI or Grafana on the reporting views (docs/reporting.md); unset = no such role.
      KERNEL_REPORTING_DB_PASSWORD: ${KERNEL_REPORTING_DB_PASSWORD:-}
      KERNEL_OUTBOUND_ALLOW: ${KERNEL_OUTBOUND_ALLOW:-}
      KERNEL_WEBHOOK_RETENTION_DAYS: ${KERNEL_WEBHOOK_RETENTION_DAYS:-30}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-kernel}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=production}
      KERNEL_BACKUP_DIR: /backups
    volumes:
      - ${KERNEL_BACKUP_DIR:-./backups}:/backups:ro
    # Hardened container: read-only filesystem, no Linux capabilities, no privilege escalation, resource limits.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 256
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kernel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kernel
    volumes:
      - pgdata:/var/lib/postgresql
    # Not published on the host; only reachable from the app and backup containers.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kernel -d kernel"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Nightly pg_dump with retention, see scripts/backup.sh. Restore with scripts/restore.sh.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: kernel
      PGDATABASE: kernel
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-UTC}
      BACKUP_TIME: ${KERNEL_BACKUP_TIME:-02:30}
      KEEP_DAILY: ${KERNEL_BACKUP_KEEP_DAILY:-7}
      KEEP_WEEKLY: ${KERNEL_BACKUP_KEEP_WEEKLY:-4}
      KEEP_MONTHLY: ${KERNEL_BACKUP_KEEP_MONTHLY:-6}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ${KERNEL_BACKUP_DIR:-./backups}:/backups
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
